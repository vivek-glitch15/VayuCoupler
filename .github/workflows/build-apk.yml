name: Build VayuCoupler Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VayuCoupler.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VayuCoupler-Android-APK
          path: VayuCoupler.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "VayuCoupler Live Android App"
          body: "🚀 Latest auto-updating Android APK for MoES VayuCoupler. Automatically syncs with live Vercel & Render deployments."
          files: VayuCoupler.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
