[build]
  publish = "backend/app/static"

# Rewrite internal static paths
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Proxy /api calls to your live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://vayucoupler-9sfi.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) catch-all routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Performance headers for static assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
